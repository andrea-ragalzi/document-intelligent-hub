# Gitleaks Configuration
# https://github.com/gitleaks/gitleaks

title = "Gitleaks Configuration for Document Intelligent Hub"

[extend]
# Usa le regole predefinite di Gitleaks come base
useDefault = true

[allowlist]
description = "Documented placeholders and non-production test fixtures only"

# Pattern da ignorare (es. test keys, examples)
regexes = [
    # Ignore example/placeholder values
    '''(?i)your[-_]?api[-_]?key[-_]?here''',
    '''(?i)your[-_]?secret[-_]?here''',
    '''(?i)example[-_]?key''',
    '''sk-proj-XXXXXXX''',
    '''AIza[a-zA-Z0-9_-]{35}EXAMPLE''',
    '''re_test_secret''',
    '''re_test''',
    '''(?i)(mock|test|fake)[-_]?(api[-_]?key|token|secret)''',
]

# Generated local output is not part of a Git or CI scan.
paths = [
    '''node_modules/''',
    '''\.venv/''',
    '''venv/''',
    '''\.git/''',
    '''\.next/''',
    '''__pycache__/''',
    '''\.pytest_cache/''',
    '''\.mypy_cache/''',
    '''coverage/''',
    '''htmlcov/''',
    '''dist/''',
    '''build/''',
    '''\.DS_Store''',
    '''chroma_db/''',
    '''logs/''',
]
