name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# A newer commit on the same PR supersedes the older validation run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PYLINT_THRESHOLD: 9.0
  COMPLEXITY_THRESHOLD: 15

jobs:
  changes:
    name: "🔍 Detect changed areas"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend_docker: ${{ steps.filter.outputs.backend_docker }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        # Pinned to the v3.0.4 commit: SonarCloud requires immutable action refs.
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci-cd.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-cd.yml'
            backend_docker:
              - 'backend/Dockerfile'
              - 'backend/.dockerignore'
              - 'backend/pyproject.toml'
              - 'backend/poetry.lock'
              - 'backend/assets/**'
              - '.github/workflows/ci-cd.yml'

  backend-ci:
    name: "🐍 Backend CI"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' &&
      ((github.event_name == 'pull_request' && github.base_ref == 'develop') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: "🐍 Set up Python ${{ env.PYTHON_VERSION }}"
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/poetry.lock

      - name: "📦 Install Poetry"
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: "💾 Restore Poetry virtualenv"
        id: poetry-venv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('backend/poetry.lock') }}

      - name: "📚 Synchronize dependencies"
        run: |
          poetry config --local installer.only-binary :all:
          poetry config --local installer.no-binary antlr4-python3-runtime,langdetect,pypika
          poetry sync --no-interaction --no-ansi

      # One environment avoids installing the Python/RAG dependency set twice.
      - name: "✨ Pylint"
        run: poetry run pylint app/ --rcfile=.pylintrc --fail-under="$PYLINT_THRESHOLD"

      - name: "🔍 MyPy"
        run: poetry run mypy app/ --strict --pretty

      - name: "🧬 Lizard"
        run: poetry run lizard app/ -l python -C "$COMPLEXITY_THRESHOLD" -w

      - name: "🧪 Tests with coverage"
        run: poetry run pytest --cov=app --cov-report=xml --cov-report=term

      - name: "📊 Upload coverage to Codecov"
        if: always()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  frontend-ci:
    name: "⚛️ Frontend CI"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true' &&
      ((github.event_name == 'pull_request' && github.base_ref == 'develop') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: "📦 Set up Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: "📚 Install dependencies"
        run: npm ci --ignore-scripts

      - name: "✨ ESLint"
        run: npm run lint -- --max-warnings=0

      - name: "🔍 TypeScript"
        run: npm run type-check

      - name: "💅 Prettier"
        run: npm run format:check

      - name: "🧪 Tests"
        run: npm run test:run

      - name: "🏗️ Production build"
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/rag
        run: npm run build

  backend-docker:
    name: "🐳 Backend Docker build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: changes
    if: >-
      needs.changes.outputs.backend_docker == 'true' &&
      ((github.event_name == 'pull_request' && github.base_ref == 'develop') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
    steps:
      - uses: actions/checkout@v4

      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: "🐳 Build deployment image"
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: document-hub-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  ci-summary:
    name: "📊 Pipeline Summary"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, backend-ci, frontend-ci, backend-docker]
    if: >-
      always() &&
      ((github.event_name == 'pull_request' && github.base_ref == 'develop') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
    steps:
      - name: "📊 Validate selected checks"
        env:
          BACKEND: ${{ needs.backend-ci.result }}
          FRONTEND: ${{ needs.frontend-ci.result }}
          DOCKER: ${{ needs.backend-docker.result }}
        run: |
          for result in "$BACKEND" "$FRONTEND" "$DOCKER"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A selected check failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "Selected CI checks passed." >> "$GITHUB_STEP_SUMMARY"

  release-gate:
    name: "🚀 Develop to main release gate"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: "🔒 Validate release source and configuration"
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -f backend/Dockerfile
          test -f frontend/next.config.ts

          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$HEAD_REF" = "develop"
            summary=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" \
              --jq '[.check_runs[] | select(.name == "📊 Pipeline Summary") | .conclusion] | last')
            test "$summary" = "success"
          else
            gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA/pulls" \
              --jq '.[] | select(.base.ref == "main" and .head.ref == "develop" and .merged_at != null) | .number' \
              | grep -q .
          fi

          echo "Release promotion is sourced from validated develop." >> "$GITHUB_STEP_SUMMARY"
