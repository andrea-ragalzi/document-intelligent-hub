# AgentBus swarm for this repository. Zed remains the control and monitoring UI;
# All seven agents are available through bounded one-shot headless Codex turns.
version: "1.0"
services:
  watch:
    command: ".agentbus-venv/bin/agentbus watch --workspace . --no-shell"
  sarah-wake:
    command: ".agentbus-venv/bin/agentbus worker up --workspace . --config .agentbus/worker.sarah.yaml"
  john-wake:
    command: ".agentbus-venv/bin/agentbus worker up --workspace . --config .agentbus/worker.john.yaml"
  mateo-wake:
    command: ".agentbus-venv/bin/agentbus worker up --workspace . --config .agentbus/worker.mateo.yaml"
  lucia-wake:
    command: ".agentbus-venv/bin/agentbus worker up --workspace . --config .agentbus/worker.lucia.yaml"
  maya-wake:
    command: ".agentbus-venv/bin/agentbus worker up --workspace . --config .agentbus/worker.maya.yaml"
  alex-wake:
    command: ".agentbus-venv/bin/agentbus worker up --workspace . --config .agentbus/worker.alex.yaml"
  alice-wake:
    command: ".agentbus-venv/bin/agentbus worker up --workspace . --config .agentbus/worker.alice.yaml"
