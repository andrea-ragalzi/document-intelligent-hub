version: "1.0"
worker_id: mateo-codex-wake
role: mateo
producer_id: mateo
cursor_path: .agentbus/worker.mateo.cursor
state_path: .agentbus/worker.mateo.state.json
subscribe:
  - topic: okf/handoff
    from: [sarah, lucia, maya, john, alex, alice]
    to: [mateo]
watch:
  mode: auto
  poll_fallback_ms: 500
  paths: [.agentbus/events.db, .agentbus/events.db-wal]
on_task:
  - write: { path: .agentbus/WAKE.mateo.json }
    exec:
      command: [.agentbus-venv/bin/python, .agentbus/dispatch.py, --agent, mateo, --runner, .agentbus/runner.mateo.yaml]
      timeout_sec: 660
budget: { max_dispatches_per_hour: 6, max_concurrent_exec: 1, idle_sleep_after_minutes: null, require_wake_after_sleep: true }
dispatch: { max_event_age: 10m }
dedupe: { by_idempotency_key: true, by_event_id: true }
lease_ttl_seconds: 300
wake_mode: file
