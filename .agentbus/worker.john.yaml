version: "1.0"
worker_id: john-codex-wake
role: john
producer_id: john
cursor_path: .agentbus/worker.john.cursor
state_path: .agentbus/worker.john.state.json
subscribe:
  - topic: okf/handoff
    from: [mateo, sarah, lucia, maya]
    to:
      - john
watch:
  mode: auto
  poll_fallback_ms: 500
  paths:
    - .agentbus/events.db
    - .agentbus/events.db-wal
on_task:
  - write:
      path: .agentbus/WAKE.john.json
    exec:
      command:
        - .agentbus-venv/bin/python
        - .agentbus/dispatch.py
        - --agent
        - john
        - --runner
        - .agentbus/runner.john.yaml
      timeout_sec: 660
budget:
  max_dispatches_per_hour: 6
  max_concurrent_exec: 1
  idle_sleep_after_minutes: null
  require_wake_after_sleep: true
dispatch:
  max_event_age: 10m
dedupe:
  by_idempotency_key: true
  by_event_id: true
lease_ttl_seconds: 300
wake_mode: file
