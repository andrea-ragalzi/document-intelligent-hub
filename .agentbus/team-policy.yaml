version: "1.0"

default_runner:
  model: gpt-5.6-luna
  reasoning_effort: low

agents:
  mateo: { role: orchestrator }
  sarah: { role: rag }
  lucia: { role: backend }
  maya: { role: frontend }
  john: { role: qa }
  alex: { role: reviewer }
  alice:
    role: rag_theory
    activation: on_demand
    default_runner:
      model: gpt-5.6-luna
      reasoning_effort: high

documentation:
  docs_impact_values: [none, update_required]

budget_profiles:
  simple:
    base_agent_runs: 3
    fix_reserve_runs: 2
    max_agent_runs: 5
    max_handoffs: 4
    max_retries_per_agent: 1
    max_fix_cycles: 1
    max_escalated_runs: 0
  normal:
    base_agent_runs: 3
    fix_reserve_runs: 2
    max_agent_runs: 5
    max_handoffs: 6
    max_retries_per_agent: 1
    max_fix_cycles: 1
    max_escalated_runs: 1
  high_risk:
    base_agent_runs: 4
    fix_reserve_runs: 2
    max_agent_runs: 6
    max_handoffs: 8
    max_retries_per_agent: 1
    max_fix_cycles: 1
    max_escalated_runs: 1
  cross_cutting:
    base_agent_runs: 5
    fix_reserve_runs: 2
    max_agent_runs: 7
    max_handoffs: 8
    max_retries_per_agent: 1
    max_fix_cycles: 1
    max_escalated_runs: 1

mateo_reasoning_reasons:
  - initial decomposition/routing
  - ambiguity
  - ownership conflict
  - architecture decision
  - blocked initiative
  - explicit final decision requiring judgment

escalation:
  requested_by: mateo
  scope: one_run
  allowed:
    - model: gpt-5.6-luna
      reasoning_effort: medium
    - model: gpt-5.6-terra
      reasoning_effort: low
    - model: gpt-5.6-sol
      reasoning_effort: low
  reasons:
    - difficult architecture decision
    - complex RAG reasoning
    - subtle concurrency/data-isolation bug
    - high-risk security review
    - problem demonstrably beyond the default run

alex_review_scopes:
  - auth/authz
  - tenant isolation
  - sensitive document boundaries
  - migrations
  - security-sensitive behavior
  - architecture-critical review
